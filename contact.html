<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Aliyu</title>
</head>
<body>

<header>
  <p>Aliyu Garba Ahmad</p>
  <nav aria-label="Primary">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
</header>

<main>
    <h1>Contact Me</h1>

  <p>
    Use the form below for project inquiries or general
    questions. I read everything myself and usually reply within 24hr.
  </p>

  <section>
    <h2>Send a Message</h2>

    <form action="/submit-contact" method="post">

      <p>
        <label for="fullname">Full Name</label><br>
        <input type="text" id="fullname" name="fullname" required minlength="2" maxlength="80" autocomplete="name">
      </p>

      <p>
        <label for="email">Email Address</label><br>
        <input type="email" id="email" name="email" required autocomplete="email">
      </p>

      <p>
        <label for="phone">Phone Number (optional)</label><br>
        <input type="tel" id="phone" name="phone" pattern="^[0-9+\-\s()]{7,20}$" autocomplete="tel">
      </p>

      <p>
        <label for="topic">Reason for Contact</label><br>
        <select id="topic" name="topic" required>
          <option value="">-- Choose one --</option>
          <option value="project">New project inquiry</option>
          <option value="other">Something else</option>
        </select>
      </p>
</main>
</body>
</html>
