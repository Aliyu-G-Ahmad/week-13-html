<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Exercise 03 - Form</title>
</head>
<body>

<h1>Contact &amp; Preferences Form</h1>

<form action="#" method="post" novalidate>

  <div class="field">
    <label for="fullname">Full Name</label>
    <input type="text" id="fullname" name="fullname" autocomplete="name" required minlength="2" maxlength="60">
  </div>

  <div class="field">
    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" autocomplete="email" required>
  </div>

  <div class="field">
    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" name="phone" autocomplete="tel" pattern="^[0-9+\-\s()]{7,20}$" placeholder="e.g. +234 800 000 0000">
  </div>

  <div class="field">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
    <small>Minimum 8 characters.</small>
  </div>

  <div class="field">
    <label for="dob">Date of Birth</label>
    <input type="date" id="dob" name="dob" autocomplete="bday" min="1900-01-01" max="2026-09-05">
  </div>

  <div class="field">
    <label for="age">Age</label>
    <input type="number" id="age" name="age" min="13" max="120" step="1">
  </div>

  <div class="field">
    <label for="satisfaction">Satisfaction Level (1–10)</label>
    <input type="range" id="satisfaction" name="satisfaction" min="1" max="10" step="1" value="5">
  </div>

  <div class="field">
    <label for="website">Personal Website</label>
    <input type="url" id="website" name="website" autocomplete="url" placeholder="https://example.com">
  </div>

  <div class="field">
    <label for="favcolor">Favorite Color</label>
    <input type="color" id="favcolor" name="favcolor" value="#2266cc">
  </div>

  <div class="field">
    <label for="avatar">Upload Profile Picture</label>
    <input type="file" id="avatar" name="avatar" accept="image/*">
  </div>

  <fieldset>
    <legend>Newsletter Preferences</legend>
    <div class="checkbox-row">
      <input type="checkbox" id="news-product" name="newsletter" value="product">
      <label for="news-product">Product updates</label>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="news-events" name="newsletter" value="events">
      <label for="news-events">Event invitations</label>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="terms" name="terms" value="agreed" required>
      <label for="terms">I agree to the Terms and Conditions</label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Preferred Contact Method</legend>
    <div class="radio-row">
      <input type="radio" id="contact-email" name="contact-method" value="email" checked>
      <label for="contact-email">Email</label>
    </div>
    <div class="radio-row">
      <input type="radio" id="contact-phone" name="contact-method" value="phone">
      <label for="contact-phone">Phone</label>
    </div>
    <div class="radio-row">
      <input type="radio" id="contact-mail" name="contact-method" value="mail">
      <label for="contact-mail">Postal Mail</label>
    </div>
  </fieldset>

  <div class="field">
    <label for="country">Country</label>
    <select id="country" name="country" autocomplete="country-name" required>
      <option value="">-- Select a country --</option>
      <optgroup label="Africa">
        <option value="NG">Nigeria</option>
        <option value="GH">Ghana</option>
        <option value="KE">Kenya</option>
      </optgroup>
      <optgroup label="Europe">
        <option value="FR">France</option>
        <option value="DE">Germany</option>
        <option value="IT">Italy</option>
      </optgroup>
      <optgroup label="North America">
        <option value="US">United States</option>
        <option value="CA">Canada</option>
        <option value="MX">Mexico</option>
      </optgroup>
    </select>
  </div>

  <div class="field">
    <label for="message">Additional Comments</label>
    <textarea id="message" name="message" rows="5" maxlength="500" placeholder="Tell us anything else..."></textarea>
  </div>

  <button type="submit">Submit Form</button>

</form>

</body>
</html>
